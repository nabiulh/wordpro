name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Android Skeleton & Permissions
        run: |
          # Create android project files if missing
          flutter create . --platforms=android --org com.example

          # Set minimum SDK to 21 for flutter_inappwebview
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/flutter.minSdkVersion/21/' android/app/build.gradle 2>/dev/null || true

          # Enable Internet permission in AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Generate App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Generate Word Pro styled icon
          convert -size 512x512 xc:'#2b579a' \
                  -fill white -gravity center \
                  -font "DejaVu-Sans-Bold" -pointsize 280 -annotate +0+0 "W" \
                  base_icon.png

          convert base_icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert base_icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert base_icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert base_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert base_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordPro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
